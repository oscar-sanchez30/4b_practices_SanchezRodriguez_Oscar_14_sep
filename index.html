<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Diagramas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        /* Estilos generales para los botones */
        .toggle-button {
            display: block;
            margin: 20px auto 10px auto;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #007BFF;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s ease;
        }
        .toggle-button:hover {
            background-color: #0056b3;
        }
        /* Contenedores de los diagramas, ocultos por defecto */
        .diagram-container {
            display: none; 
            background: white;
            padding: 10px;
            margin-bottom: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        iframe {
            display: block;
            border: none;
        }
    </style>
</head>

    <!-- Script para dar funcionamiento individual a cada botón -->
    <script>
        function toggleDiagram(diagramId, btnElement) {
            var diagram = document.getElementById(diagramId);
            
            if (diagram.style.display === "none" || diagram.style.display === "") {
                // Mostrar el diagrama
                diagram.style.display = "block";
                // Cambiar texto y color del botón
                btnElement.textContent = btnElement.textContent.replace("Ver", "Ocultar");
                btnElement.style.backgroundColor = "#dc3545"; // Rojo
            } else {
                // Ocultar el diagrama
                diagram.style.display = "none";
                // Restaurar texto y color del botón
                btnElement.textContent = btnElement.textContent.replace("Ocultar", "Ver");
                btnElement.style.backgroundColor = "#007BFF"; // Azul
            }
        }
    </script>
